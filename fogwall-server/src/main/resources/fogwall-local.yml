server:
  # Externally-reachable base URL fogwall is reachable at — the bare host, WITHOUT a /dashboard suffix
  # (fogwall appends /dashboard, /api, etc. itself where needed). Used to build things like "link your
  # identity" hints and OAuth redirect_uris. No default is baked in for real deployments (it must match how
  # operators actually expose fogwall), so local dev needs it set explicitly too.
  service-url: http://localhost:8080
  ssh:
    enabled: true
    # port: 2222
    # SSH public keys are registered per-user on the profile page.
    # Local dev: the Gitea test container regenerates its SSH host key on each start, so it can't be pinned
    # ahead of time — trust it on first connect. Do NOT enable this in production; pin known-hosts instead.
    trust-on-first-use: true
  # Allow the Vite dev server to make cross-origin requests to the backend.
  # Vite defaults to port 5173; adjust if you've changed it.
  allowed-origins:
    - http://localhost:5173
  # Use default h2 database for local development - save the sessions there as well
  session-store: jdbc

providers:
  # A single provider entry serves BOTH HTTP and SSH to the same upstream (#531) — there is no separate
  # "gitea-ssh" entry, and an OAuth-linked identity applies to both transports automatically. The dashboard
  # Clone button shows an HTTPS/SSH toggle for any entry with `ssh.enabled: true` (and the listener on above).
  gitea:
    enabled: true
    uri: http://localhost:3000          # HTTP/API endpoint
    # Proposals: open and iterate on PRs through fogwall with tea/fj.
    # Its own listener on 9445 — the dialect is mounted at that port's root because gh and fj
    # address the API from the host root and discard any path prefix. Point a CLI at it with:
    #   tea login add --name fogwall --url http://localhost:9445 --token <your-gitea-token>
    #   fj -H http://localhost:9445 pr create "title" --body "body"
    proposals:
      enabled: true
      port: 9445
    ssh:
      enabled: true
      uri: ssh://git@localhost:3022     # explicit: the local Gitea container exposes SSH on 3022, not the default 22
      # api-token: <PAT>                # required when Gitea is configured with REQUIRE_SIGNIN_VIEW=true
  # github over BOTH HTTPS and SSH from one entry (the SSH endpoint is derived as ssh://git@github.com).
  # To actually push/fetch through it you need your OWN github.com SSH key loaded in ssh-agent — fogwall relays
  # your forwarded agent (ssh -A), it never holds credentials itself. Steps:
  #   1. Add your real public key under dev's ssh-keys below (replace the placeholder test key, or add a second entry).
  #   2. Add your GitHub username under dev's scm-identities for provider: github (see below).
  #   3. Add an allow rule + permission for a repo you actually control (see rules/permissions below).
  #   4. HTTPS: git clone http://localhost:8080/server/github.com/<org>/<repo>.git
  #      SSH:   git clone ssh://localhost:2222/github.com/<org>/<repo>.git   (agent forwarding required: ssh -A)
  github:
    enabled: true
    ssh:
      enabled: true
    # Proposals on their own listener — this is the common case: open a PR against a real
    # github.com repo through fogwall, inspected and audited, with your own token.
    #   GH_HOST=localhost:9443 GH_TOKEN=<classic PAT> \
    #     gh pr create -R localhost:9443/<owner>/<repo> --base main --head <branch> --title ...
    # GH_HOST takes a host[:port] and never a path, which is why this needs a port of its own.
    proposals:
      enabled: true
      port: 9443
  # gitlab.com, on its own listener. glab is pointed at a host with `glab auth login --hostname`,
  # or per-invocation with GITLAB_HOST — same host[:port]-with-no-path constraint as gh.
  #   GITLAB_HOST=localhost:9444 GITLAB_TOKEN=<PAT> \
  #     glab mr create -R coopernetes/test-repo --source-branch <branch> --target-branch main --title ...
  gitlab:
    enabled: true
    proposals:
      enabled: true
      port: 9444
# Three users for local development:
#   admin    — full dashboard access, can approve any push
#   dev      — a developer account; add your SCM identity here to push through the proxy
#   reviewer — approve-only account for testing the approval flow separately from the pusher
#
# To try it out:
#   1. Add your SCM username under dev's scm-identities (e.g. provider: github, username: your-gh-handle)
#   2. Add an allow rule and permission for your test repo (see rules/permissions below)
#   3. Start the server and push with your own PAT
#
# Password format: {noop}plaintext (dev only — use {bcrypt} in production).
auth:
  provider: local

users:
  - username: admin
    password-hash: "{noop}admin"
    roles: [ADMIN]
    emails:
      - admin@example.com

  - username: dev
    password-hash: "{noop}password"
    roles: [ADMIN, SELF_CERTIFY]
    scm-identities:
      - provider: gitea
        username: test-user
      # Uncomment and set to your real GitHub username to use the github provider above (HTTPS or SSH):
      # - provider: github
      #   username: your-gh-handle
      # Proposals resolve the caller from their token: fogwall asks the provider who the token belongs to,
      # then matches that login here. Without an entry the CLI gets a 401 from fogwall, not from the SCM.
      # - provider: gitlab
      #   username: your-gitlab-handle
    emails:
      - dev@example.com
    ssh-keys:
        - public-key: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAILZutQPsqDrByIRlmp6JgAK8DSGzf7+SoKBzjCy+av2J fogwall-test@local"
        # Add your own real key here (the one loaded in your ssh-agent, already registered on github.com)
        # to authenticate against the github provider over SSH — the placeholder key above only works for gitea
        # since it's pre-registered with the local Gitea test container, not with GitHub.
        # - public-key: "ssh-ed25519 AAAA... you@yourhost"

  - username: reviewer
    password-hash: "{noop}password"

commit:
  author:
    email:
      # Domains allowed for commit authors. Broad defaults for local dev.
      domain:
        allow: "(proton\\.me|gmail\\.com|outlook\\.com|yahoo\\.com|example\\.com)$"
      # Local-parts (before @) that are always blocked regardless of domain.
      local:
        block: "^(noreply|no-reply|bot|nobody)$"
  message:
    block:
      literals:
        - "WIP"
        - "DO NOT MERGE"
        - "fixup!"
        - "squash!"
      patterns:
        - '(?i)(password|secret|token)\s*[=:]\s*\S+'

diff-scan:
  block:
    literals:
      - "internal.corp.example.com"
    patterns:
      - '(?i)https?://[a-z0-9.-]*\.corp\.example\.com\b'

secret-scan:
  enabled: true

# Proposals — proposing changes (open/edit/comment on a PR) through fogwall.
proposals:
  # Content rules for the prose a proposal carries — PR/MR title and description, comment bodies. Separate from
  # diff-scan.block, which applies to pushed diffs. Secret scanning is governed by secret-scan below.
  block:
    literals:
      - "internal.corp.example.com"
    patterns:
      - '(?i)https?://[a-z0-9.-]*\.corp\.example\.com\b'

binary-blob:
  enabled: true
  max-size-bytes: 52428800
  deny-mime-types:
    - application/pdf
    - application/zip

attestations:
  - id: reviewed-content
    type: checkbox
    label: "I have reviewed the diff and it contains no sensitive or proprietary information"
    required: true
    links:
      - text: "Data classification policy"
        url: "https://policies.corp.example.com/data-classification"
  - id: policy-compliance
    type: checkbox
    label: "This push complies with our open source contribution policy"
    required: true
    links:
      - text: "Open source contribution policy"
        url: "https://policies.corp.example.com/open-source-contribution"
      - text: "Approved license list"
        url: "https://policies.corp.example.com/approved-licenses"
  - id: ticket-ref
    type: text
    label: "Internal ticket or justification reference"
    required: false

# Repo permissions for local dev.
#
# dev:      push access on allowed repos — add your test repo below
# reviewer: approve-only (can review any push dev submits)
# admin:    can also approve via the dashboard by virtue of its ADMIN role
permissions:
  # One entry covers both transports now — the same `gitea` provider serves HTTP and SSH (#531).
  - username: dev
    provider: gitea
    match:
      target: SLUG
      value: .*
      type: REGEX
    grant: PUSH
  # PROPOSE is a separate axis from PUSH — pushing to a fork proposes nothing, so opening a PR
  # needs its own grant, matched against the UPSTREAM the PR targets rather than the fork.
  - username: dev
    provider: gitea
    match:
      target: SLUG
      value: .*
      type: REGEX
    grant: PROPOSE
  # PROPOSE on github — matched against the UPSTREAM a PR targets, so scope it to a repo you can
  # actually open PRs against. Widen or narrow as you like; this is local dev.
  - username: dev
    provider: github
    match:
      target: SLUG
      value: .*
      type: REGEX
    grant: PROPOSE
  - username: dev
    provider: gitlab
    match:
      target: SLUG
      value: .*
      type: REGEX
    grant: PROPOSE
  # For github (HTTPS or SSH — same entry), scope this to a repo you actually control:
  # - username: dev
  #   provider: github
  #   match:
  #     target: SLUG
  #     value: /your-org/your-repo
  #     type: LITERAL
  #   grant: PUSH

rules:
  # Evaluated like firewall rules: all allow and deny rules merged into a single list
  # sorted by order (ascending). First matching rule wins.
  deny:
    # Example: block pushes to *.github.io repos
    - enabled: true
      order: 20
      operation: PUSH
      provider: gitea
      match:
        target: NAME
        value: "*.github.io"
        type: GLOB

  allow:
    # Allow fetch and push to this project's own repo
    - enabled: true
      order: 100
      operation: BOTH
      provider: gitea
      match:
        target: SLUG
        value: .*
        type: REGEX

    # For github (HTTPS or SSH — same entry), scope this to a repo you actually control:
    # - enabled: true
    #   order: 110
    #   operation: BOTH
    #   provider: github
    #   match:
    #     target: SLUG
    #     value: /your-org/your-repo
    #     type: LITERAL
