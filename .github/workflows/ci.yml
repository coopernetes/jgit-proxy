name: CI

permissions:
  contents: read

on:
  push:
    branches: ["main", "release/*"]
  pull_request:
    branches: ["main"]

# On main, give every commit its own concurrency group (via SHA) so runs never cancel
# each other — each landed commit goes through the full CI in parallel. On PR/other refs,
# superseded runs are cancelled on new pushes to save resources.
concurrency:
  group: ci-${{ github.ref }}${{ github.ref == 'refs/heads/main' && format('-{0}', github.sha) || '' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1

      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # ratchet:actions/setup-java@v6.0.0
        with:
          distribution: temurin
          java-version: 25
          cache: gradle

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # ratchet:actions/setup-node@v6
        with:
          node-version: '26.3.1'
          cache: npm
          cache-dependency-path: fogwall-dashboard/frontend/package-lock.json

      - name: Build and test
        run: ./gradlew build

      - name: Verify coverage thresholds
        run: ./gradlew jacocoTestCoverageVerification

      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # ratchet:actions/upload-artifact@v7
        with:
          name: test-reports
          path: "**/build/reports/tests/test/"
          retention-days: 14

      - name: Publish JaCoCo coverage reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # ratchet:actions/upload-artifact@v7
        with:
          name: jacoco-reports
          path: "**/build/reports/jacoco/"
          retention-days: 14

      - name: Publish PMD reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # ratchet:actions/upload-artifact@v7
        with:
          name: pmd-reports
          path: "**/build/reports/pmd/"
          retention-days: 14

  # Build the fogwall image once and hand it to every smoke-test matrix job as an
  # artifact, so the three DB variants reuse one image instead of each rebuilding it.
  # gha layer caching warms the build across runs too.
  build-smoke-image:
    name: Docker Smoke Test (setup)
    runs-on: ubuntu-latest
    if: >
      github.ref == 'refs/heads/main' ||
      startsWith(github.ref, 'refs/heads/release/') ||
      github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # ratchet:docker/setup-buildx-action@v4

      - name: Build fogwall image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # ratchet:docker/build-push-action@v7
        with:
          context: .
          target: dashboard
          build-args: |
            BUILD_COMMIT=${{ github.sha }}
          load: true
          tags: fogwall:local
          cache-from: type=gha,scope=smoke-dashboard
          cache-to: type=gha,mode=max,scope=smoke-dashboard

      - name: Save image to a tarball
        run: docker save fogwall:local | gzip > fogwall-image.tar.gz

      - name: Upload image artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # ratchet:actions/upload-artifact@v7
        with:
          name: fogwall-smoke-image
          path: fogwall-image.tar.gz
          retention-days: 1

  docker-smoke-test:
    name: Docker Smoke Test (${{ matrix.db }})
    runs-on: ubuntu-latest
    needs: build-smoke-image
    if: >
      github.ref == 'refs/heads/main' ||
      startsWith(github.ref, 'refs/heads/release/') ||
      github.event_name == 'pull_request'
    strategy:
      matrix:
        db: [default, postgres, mongo]
        # auth: [ldap, oidc]  # Uncomment when auth smoke tests are added
      fail-fast: false

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1

      - name: Download fogwall image
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # ratchet:actions/download-artifact@v8.0.1
        with:
          name: fogwall-smoke-image

      - name: Load fogwall image
        run: docker load < fogwall-image.tar.gz

      - name: Start stack
        env:
          DB: ${{ matrix.db }}
        run: |
          if [[ "$DB" != "default" ]]; then
            bash compose.sh --db "$DB" -- up -d
          else
            bash compose.sh -- up -d
          fi
        timeout-minutes: 5

      - name: Wait for proxy health
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/api/health > /dev/null; then
              echo "Proxy healthy after ${i}s"
              break
            fi
            sleep 1
          done
          curl -sf http://localhost:8080/api/health

      - name: Seed Gitea
        run: bash docker/gitea-setup.sh

      - name: Run proxy smoke tests
        run: |
          source test/gitea/tokens.env
          export GIT_PASSWORD="${GITEA_TESTUSER_TOKEN}"
          export GIT_USERNAME="me"
          export GIT_REPO="gitea:3000/test-owner/test-repo.git"
          export GIT_AUTHOR_NAME="test-user"
          export GIT_EMAIL="testuser@example.com"
          # Proxy mode only — server mode passes queue for approval and hang
          bash test/proxy-pass.sh
          bash test/proxy-fail-secrets.sh

      - name: Dump proxy logs on failure
        if: failure()
        env:
          DB: ${{ matrix.db }}
        run: |
          if [[ "$DB" != "default" ]]; then
            bash compose.sh --db "$DB" -- logs fogwall
          else
            bash compose.sh -- logs fogwall
          fi

  playwright-test:
    name: Playwright UI Tests
    runs-on: ubuntu-latest
    if: >
      github.ref == 'refs/heads/main' ||
      github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1

      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # ratchet:actions/setup-java@v6.0.0
        with:
          distribution: temurin
          java-version: 25
          cache: gradle

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # ratchet:actions/setup-node@v6
        with:
          node-version: '26.3.1'
          cache: npm
          cache-dependency-path: fogwall-dashboard/frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: fogwall-dashboard/frontend

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: fogwall-dashboard/frontend

      # Pre-build the app (compile all modules + frontend) so the Playwright webServer's
      # `gradlew :fogwall-dashboard:run` finds everything up-to-date and only has to boot Spring,
      # instead of cold-compiling inside the webServer timeout. See #550.
      - name: Pre-build the dashboard app
        run: ./gradlew :fogwall-dashboard:assemble

      - name: Run Playwright tests
        run: npm run test:e2e
        working-directory: fogwall-dashboard/frontend

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # ratchet:actions/upload-artifact@v7
        with:
          name: playwright-report
          path: fogwall-dashboard/frontend/playwright-report/
          retention-days: 14

  dependency-submission:
    name: Dependency Submission
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1

      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # ratchet:actions/setup-java@v6.0.0
        with:
          distribution: temurin
          java-version: 25
          cache: gradle

      - name: Submit dependency graph
        uses: gradle/actions/dependency-submission@9c971963bec38e04b3d30dcc455b5382be2fdbfb # ratchet:gradle/actions/dependency-submission@v6

  e2e-test:
    name: E2E Test
    runs-on: ubuntu-latest
    # E2E tests spin up containers; only run on push/PR to the main branches
    # to avoid burning minutes on every feature branch commit.
    if: >
      github.ref == 'refs/heads/main' ||
      github.ref == 'refs/heads/jetty' ||
      github.event_name == 'pull_request' ||
      startsWith(github.ref, 'refs/heads/release/')

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1

      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # ratchet:actions/setup-java@v6.0.0
        with:
          distribution: temurin
          java-version: 25
          cache: gradle

      - name: Run e2e tests
        run: ./gradlew :fogwall-server:e2eTest :fogwall-dashboard:e2eTest
        # Covers a cold compile as well as the suites themselves; the server suite alone runs ~3m on a
        # healthy runner, the dashboard auth suite (LDAP/OIDC via Testcontainers) well under 1m warm
        timeout-minutes: 15

      - name: Publish e2e test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # ratchet:actions/upload-artifact@v7
        with:
          name: e2e-test-reports
          path: |
            fogwall-server/build/reports/tests/e2eTest/
            fogwall-dashboard/build/reports/tests/e2eTest/
            fogwall-dashboard/build/reports/e2e-app.log
          retention-days: 14
